name: engine-pair

# Keeps the template on the newest published Engine pair. The pin advances
# only after the product builds and serves on the proposed pair; a pair that
# breaks the template fails this workflow and opens (or updates) an issue,
# and the template stays on its working pin.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact pair version to propose (default: newest published)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: engine-pair-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: src/RustyTemplate.Game/RustyTemplate.Game.csproj
  FAILURE_LABEL: engine-pair-update

jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get rusty
        run: |
          curl -fsSL https://raw.githubusercontent.com/FuzzySlipper/rusty-engine/main/scripts/install-rusty.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Propose the pair
        id: propose
        env:
          VERSION: ${{ inputs.version }}
        run: |
          from=$(sed -n 's|.*<RustyEnginePackageVersion>\([^<]*\)</RustyEnginePackageVersion>.*|\1|p' Directory.Build.props)
          rusty update ${VERSION:+--to "$VERSION"} | tee update.log
          to=$(sed -n 's|.*<RustyEnginePackageVersion>\([^<]*\)</RustyEnginePackageVersion>.*|\1|p' Directory.Build.props)
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          if [[ "$from" == "$to" ]]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build the product on the proposed pair
        if: steps.propose.outputs.changed == 'true'
        run: |
          set -o pipefail
          rusty build --project "$PROJECT" 2>&1 | tee build.log

      - name: Serve the product on the proposed pair
        if: steps.propose.outputs.changed == 'true'
        run: |
          rusty dev --project "$PROJECT" --port 8787 > dev.log 2>&1 &
          dev=$!
          served=false
          for _ in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8787/product-bootstrap.json -o bootstrap.json; then served=true; break; fi
            kill -0 "$dev" 2>/dev/null || break
            sleep 1
          done
          kill -TERM "$dev" 2>/dev/null || true
          wait "$dev" || true
          if [[ "$served" != true ]] || ! grep -q '"id":"rusty-template"' bootstrap.json; then
            echo "The product did not serve on the proposed pair." | tee -a dev.log
            cat dev.log
            exit 1
          fi

      - name: Advance the pin
        if: steps.propose.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.propose.outputs.from }}
          TO: ${{ steps.propose.outputs.to }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Adopt Engine pair $TO"
            echo
            echo "Built and served by the engine-pair workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            sed -n '/^What changed/,/^Next:/p' update.log | sed '$d'
          } > message.txt
          git commit -q -F message.txt Directory.Build.props
          git push origin "HEAD:$GITHUB_REF_NAME"
          for issue in $(gh issue list --label "$FAILURE_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "The template adopted Engine pair $TO in $(git rev-parse --short HEAD)."
          done

      - name: Report the failed update
        if: failure() && steps.propose.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.propose.outputs.from }}
          TO: ${{ steps.propose.outputs.to }}
        run: |
          {
            echo "The engine-pair workflow could not move the template from \`$FROM\` to \`$TO\` on \`$GITHUB_REF_NAME\`. The pin was not changed."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "### Release notes to read"
            echo '```'
            sed -n '/^What changed/,/^Next:/p' update.log | sed '$d'
            echo '```'
            for log in build.log dev.log; do
              [[ -s "$log" ]] || continue
              echo "### Last lines of $log"
              echo '```'
              grep -E " error |error:|Error|FAILED" "$log" | head -n 20 || true
              tail -n 20 "$log"
              echo '```'
            done
          } > report.md
          gh label create "$FAILURE_LABEL" --color d73a4a --description "The newest Engine pair breaks the template" 2>/dev/null || true
          existing=$(gh issue list --label "$FAILURE_LABEL" --state open --json number --jq '.[0].number')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --label "$FAILURE_LABEL" --title "Engine pair $TO breaks the template" --body-file report.md
          fi
